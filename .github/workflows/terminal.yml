
name: Generate Linux Terminal Animation

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - ".github/workflows/terminal.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: pip install pillow

      - name: Generate Animated Terminal GIF
        run: |
          mkdir -p dist

          cat > generate_terminal.py <<'PY'
          from PIL import Image, ImageDraw, ImageFont

          W, H = 1400, 700
          BG = "#050505"
          GREEN = "#00FF87"
          WHITE = "#D1FAE5"
          MUTED = "#6B9B7D"

          regular = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf", 17
          )
          small = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf", 13
          )
          bold = ImageFont.truetype(
              "/usr/share/fonts/truetype/dejavu/DejaVuSansMono-Bold.ttf", 17
          )

          logo = [
              "██████╗ ██╗   ██╗████████╗██╗  ██╗██╗   ██╗",
              "██╔══██╗██║   ██║╚══██╔══╝██║  ██║██║   ██║",
              "██████╔╝██║   ██║   ██║   ███████║██║   ██║",
              "██╔══██╗██║   ██║   ██║   ██╔══██║╚██╗ ██╔╝",
              "██║  ██║╚██████╔╝   ██║   ██║  ██║ ╚████╔╝",
              "╚═╝  ╚═╝ ╚═════╝    ╚═╝   ╚═╝  ╚═╝  ╚═══╝",
          ]

          commands = [
              ("whoami", "Ruthvik Roy"),
              ("skills", "Python | C | AI | Cloud | Graphic Design"),
              ("experience", "3 Years of Graphic Design"),
              ("currently_learning", "Cloud Technologies"),
              ("current_focus", "AI-Powered Prototypes"),
              ("status", "Always Building. Always Learning."),
              ("help", "whoami | skills | experience | currently_learning | current_focus | status"),
          ]

          def render(completed, active="", cursor=True):
              img = Image.new("RGB", (W, H), BG)
              d = ImageDraw.Draw(img)

              # Terminal window
              d.rounded_rectangle(
                  (15, 15, W-15, H-15),
                  radius=15,
                  outline="#16432E",
                  width=2
              )

              # Window header
              d.rounded_rectangle(
                  (16, 16, W-16, 65),
                  radius=12,
                  fill="#101713"
              )

              d.ellipse((38, 34, 51, 47), fill="#FF5F56")
              d.ellipse((63, 34, 76, 47), fill="#FFBD2E")
              d.ellipse((88, 34, 101, 47), fill="#27C93F")

              d.text(
                  (W//2, 32),
                  "RUTHVIK@DEV:~$  -  RETRO ARCADE TERMINAL",
                  font=small,
                  fill=GREEN,
                  anchor="mm"
              )

              d.text(
                  (W-45, 34), "[ONLINE]",
                  font=small, fill=GREEN, anchor="rm"
              )

              # ASCII artwork
              y = 95
              for line in logo:
                  d.text((45, y), line, font=small, fill=GREEN)
                  y += 25

              d.line((35, 255, W-35, 255), fill="#16432E", width=1)

              # Terminal command history
              y = 280
              for command, output in completed:
                  d.text(
                      (45, y),
                      f"RUTHVIK@DEV:~$ {command}",
                      font=bold,
                      fill=GREEN
                  )
                  y += 25

                  d.text(
                      (65, y),
                      f"> {output}",
                      font=regular,
                      fill=WHITE
                  )
                  y += 32

              # Currently typing
              if active:
                  d.text(
                      (45, y),
                      f"RUTHVIK@DEV:~$ {active}",
                      font=bold,
                      fill=GREEN
                  )

                  if cursor:
                      x = d.textbbox(
                          (45, y),
                          f"RUTHVIK@DEV:~$ {active}",
                          font=bold
                      )[2] + 5

                      d.rectangle(
                          (x, y+3, x+11, y+21),
                          fill=GREEN
                      )

              # Bottom status
              d.text(
                  (45, H-48),
                  "SYSTEM STATUS: BUILDING SOMETHING INTERESTING...",
                  font=small,
                  fill=MUTED
              )

              return img

          frames = []
          completed = []

          # Initial terminal screen
          frames.append(render(completed))

          # Typing animation
          for command, output in commands:
              for i in range(0, len(command)+1, 2):
                  frames.append(
                      render(completed, command[:i], i % 4 != 0)
                  )

              completed.append((command, output))

              # Show command output
              frames.append(render(completed))

          # Final blinking cursor
          for i in range(12):
              frames.append(
                  render(completed, " ", i % 2 == 0)
              )

          # Save optimized animated GIF
          frames[0].save(
              "dist/terminal.gif",
              save_all=True,
              append_images=frames[1:],
              duration=85,
              loop=0,
              optimize=True,
              disposal=2
          )

          print("Terminal animation generated successfully!")
          PY

          python generate_terminal.py

      # Checkout existing output branch to preserve Snake assets
      - name: Checkout Output Branch
        uses: actions/checkout@v4
        with:
          ref: output
          path: output-branch

      - name: Publish Terminal Animation
        run: |
          cp dist/terminal.gif output-branch/terminal.gif

          cd output-branch

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add terminal.gif

          if ! git diff --cached --quiet; then
            git commit -m "Update animated Linux terminal"
            git push origin HEAD:output
          else
            echo "Terminal animation is already up to date."
          fi
