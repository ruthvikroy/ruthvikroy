name: Generate Contribution Snake

on:
  schedule:
    # Runs automatically every day at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    name: Generate Light/Dark SVG & GIF Snake Assets
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Snake Animation (SVG & GIF for Light and Dark themes)
        uses: Platane/snk@v3
        with:
          github_user_name: ruthvikroy
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00FF87&color_dots=#0B0F0D,#1e1b4b,#4c1d95,#6d28d9,#7C3AED
            dist/github-contribution-grid-snake.gif
            dist/github-contribution-grid-snake-dark.gif?palette=github-dark

      - name: Verify All 4 Generated Assets Exist and Are Non-Empty
        run: |
          ls -lh dist/
          test -s dist/github-contribution-grid-snake.svg
          test -s dist/github-contribution-grid-snake-dark.svg
          test -s dist/github-contribution-grid-snake.gif
          test -s dist/github-contribution-grid-snake-dark.gif

      - name: Deploy Verified Assets to output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
