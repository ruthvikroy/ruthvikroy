
name: Generate Current Focus Matrix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/current-focus.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate animated SVG
        run: |
          mkdir -p dist

          cat > dist/current-focus.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg"
               width="900" height="300" viewBox="0 0 900 300">
            <style>
              text {
                font-family: monospace;
                fill: #00FF87;
              }
              .title { font-size: 22px; font-weight: bold; }
              .item { font-size: 16px; }
              .status { font-size: 15px; fill: #7C3AED; }
              .cursor {
                animation: blink 1s steps(2, start) infinite;
              }
              @keyframes blink {
                to { visibility: hidden; }
              }
              .line {
                stroke: #00FF87;
                stroke-width: 1;
                opacity: 0.7;
              }
            </style>

            <rect width="900" height="300" rx="12" fill="#050505"/>
            <rect x="2" y="2" width="896" height="296"
                  rx="10" fill="none" stroke="#00FF87"/>

            <text x="30" y="42" class="title">
              &gt; CURRENT FOCUS MATRIX
            </text>

            <line x1="30" y1="60" x2="870" y2="60" class="line"/>

            <text x="35" y="100" class="item">
              [01] Python &amp; C Programming
            </text>
            <text x="35" y="138" class="item">
              [02] Cloud Infrastructure &amp; Services
            </text>
            <text x="35" y="176" class="item">
              [03] AI-Powered Prototypes
            </text>
            <text x="35" y="214" class="item">
              [04] Creative Technology
            </text>
            <text x="35" y="252" class="item">
              [05] Design x Software Development
            </text>

            <line x1="30" y1="268" x2="870" y2="268" class="line"/>

            <text x="35" y="289" class="status">
              STATUS :: BUILDING SOMETHING INTERESTING...
            </text>
            <text x="515" y="289" class="cursor">_</text>
          </svg>
          SVG

      - name: Publish SVG to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_branch: output
          publish_dir: ./dist
          github_token: ${{ secrets.GITHUB_TOKEN }}
          keep_files: true
